version: "3.9"

services:
  # ------------------------------------------------------------------ #
  #  Backend API                                                         #
  # ------------------------------------------------------------------ #
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./quantumagent.db
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=quantumagent
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - BROKER_URL=redis://redis:6379/1
      - LOG_LEVEL=INFO
    depends_on:
      - redis
      - neo4j
      - qdrant
    volumes:
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ------------------------------------------------------------------ #
  #  Celery worker for long-running tasks                                #
  # ------------------------------------------------------------------ #
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    command: celery -A backend.orchestrator.celery_app worker --concurrency=4 --loglevel=info
    environment:
      - BROKER_URL=redis://redis:6379/1
      - RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      - redis
    restart: unless-stopped

  # ------------------------------------------------------------------ #
  #  Frontend (Next.js)                                                  #
  # ------------------------------------------------------------------ #
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  # ------------------------------------------------------------------ #
  #  Redis (broker + cache)                                              #
  # ------------------------------------------------------------------ #
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # ------------------------------------------------------------------ #
  #  Neo4j (knowledge graph)                                             #
  # ------------------------------------------------------------------ #
  neo4j:
    image: neo4j:5.15
    ports:
      - "7474:7474"  # HTTP browser
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/quantumagent
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

  # ------------------------------------------------------------------ #
  #  Qdrant (vector store)                                               #
  # ------------------------------------------------------------------ #
  qdrant:
    image: qdrant/qdrant:v1.7.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ------------------------------------------------------------------ #
  #  Prometheus + Grafana (observability)                                #
  # ------------------------------------------------------------------ #
  prometheus:
    image: prom/prometheus:v2.47.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.1.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=quantumagent
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  redis_data:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  grafana_data:
